<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AI Trip Planner - Prompt | RoutheonSkups</title>
    <link rel="stylesheet" href="/static/css/tailwind-output.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/charcoal.css') }}">
    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #E5E5E5;
            transition: color 300ms, background-color 300ms;
        }
        .dark body {
            background-color: #000000;
            color: #F5F5F5;
        }
        .glass-card {
            background-color: rgba(0,0,0,0.8);
            border: 1px solid rgba(51,51,51,0.2);
        }
        .dark .glass-card {
            background-color: rgba(10,10,10,0.8);
            border-color: rgba(51,51,51,0.05);
        }
        .ai-loading-gradient {
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.2), transparent);
            background-size: 200% 100%;
            animation: loading 1.5s infinite linear;
        }
        @keyframes loading {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }
        .floating-back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 20;
            color: #CCCCCC;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
        }
        @media (min-width: 768px) {
            .floating-back-btn {
                top: 2rem;
                left: 2rem;
            }
        }
        .floating-back-btn:hover {
            color: #E5E5E5;
            transform: translateY(-0.125rem) scale(1.1);
        }
        .floating-back-btn:focus-visible {
            outline: none;
            border-radius: 9999px;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0A0A0A;
        }
        #generate-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col">
    <div class="ks-cinema-bg"></div>
    <div class="ks-grain"></div>
    <div class="ks-vignette"></div>
    <canvas id="ks-particles-canvas"></canvas>

    <!-- Navbar (Simplified version of plan_a_trip) -->
    {% include 'components/navbar.html' %}
    <main class="flex-grow flex flex-col items-center pt-32 pb-16 px-4 relative overflow-hidden">
        <button type="button" class="floating-back-btn" aria-label="Go back" onclick="goBackOrPlan()">
            <span class="material-symbols-outlined text-[42px] md:text-[46px]">arrow_back</span>
        </button>
        <!-- Background Elements -->
        <div class="absolute inset-0 z-0 pointer-events-none">
            <div
                class="absolute top-1/4 -right-20 w-[600px] h-[600px] bg-[#111111]/40 dark:bg-[#000000]/10 blur-[120px] rounded-full">
            </div>
            <div
                class="absolute bottom-1/4 -left-20 w-[500px] h-[500px] bg-[#0A0A0A]/40 dark:bg-bg-[#000000]/10 blur-[120px] rounded-full">
            </div>
        </div>

        <div class="relative z-10 w-full max-w-4xl mx-auto">
            <div id="prompt-step" class="text-center transition-all duration-500">
                <span
                    class="inline-block px-4 py-1.5 mb-6 text-xs font-bold tracking-widest uppercase bg-[#0A0A0A] text-[#80deea] dark:bg-[#0A0A0A]/50 text-[#80deea] rounded-full">
                    AI Prompt Experience
                </span>
                <h1
                    class="text-3xl md:text-5xl font-extrabold text-text-main-light dark:text-white tracking-tight mb-8">
                    Describe your dream trip
                </h1>

                <div class="glass-card p-8 rounded-3xl shadow-soft">
                    <textarea id="trip-prompt" rows="5"
                        class="w-full bg-surface-light dark:bg-black/20 border-border-light dark:border-[#333333]/10 rounded-2xl p-6 text-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all resize-none"
                        placeholder="e.g., A 5-day spiritual journey through Varanasi and Bodhgaya with early morning boat rides and temple visits..."></textarea>

                    <div class="mt-8 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div class="flex gap-2 flex-wrap justify-center">
                            <button
                                onclick="fillPreset('A weekend gateway to Ooty focusing on tea gardens and lake views')"
                                class="px-4 py-2 rounded-full bg-[#111111] dark:bg-[#000000]/5 text-primary dark:text-[#90caf9] text-xs font-bold hover:bg-primary hover:text-white transition-all">🌿
                                Weekend Ooty</button>
                            <button
                                onclick="fillPreset('10-day adventure in Spiti valley, focusing on monasteries and high altitude treks')"
                                class="px-4 py-2 rounded-full bg-[#111111] dark:bg-[#000000]/5 text-primary dark:text-[#90caf9] text-xs font-bold hover:bg-primary hover:text-white transition-all">🏔️
                                Spiti Adventure</button>
                        </div>
                        <button id="generate-btn" type="button" onclick="generatePlan()"
                            class="w-full md:w-auto px-10 py-4 bg-primary hover:bg-primary-hover text-white rounded-2xl font-bold text-lg shadow-lg shadow-[#0A0A0A]/30 transition-all flex items-center justify-center gap-3">
                            <span id="btn-text">Generate Plan</span>
                            <span class="material-icons-round animate-spin hidden" id="loading-icon">autorenew</span>
                            <span class="material-icons-round" id="sparkle-icon">auto_awesome</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section (Hidden Initially) -->
            <div id="results-step" class="hidden opacity-0 transform translate-y-8 transition-all duration-700 mt-12">
                <div class="glass-card p-10 rounded-3xl shadow-hover border-primary/20">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
                        <div>
                            <h2 id="res-destination"
                                class="text-3xl font-extrabold text-text-main-light dark:text-white mb-2"></h2>
                            <p id="res-tagline" class="text-[#80deea] font-semibold italic"></p>
                        </div>
                        <div
                            class="px-6 py-3 bg-[#111111] dark:bg-[#000000]/40 rounded-2xl border border-[#1A1A1A]">
                            <span id="res-duration" class="text-xl font-bold text-primary"></span>
                        </div>
                    </div>

                    <div id="itinerary-grid"
                        class="grid gap-12 border-l-2 border-[#1A1A1A] pl-8 ml-4 relative">
                        <!-- Days injected here -->
                    </div>

                    <div
                        class="mt-16 p-8 bg-surface-light dark:bg-[#000000]/5 rounded-3xl border border-border-light dark:border-[#333333]/5">
                        <h3 class="flex items-center gap-3 text-lg font-bold mb-6">
                            <span class="material-icons-round text-primary">tips_and_updates</span>
                            Skupheon's Travel Tips
                        </h3>
                        <ul id="res-tips"
                            class="grid md:grid-cols-3 gap-6 text-sm text-text-muted-light dark:text-text-muted-dark">
                            <!-- Tips injected here -->
                        </ul>
                    </div>

                    <div class="mt-12 flex justify-center gap-4">
                        <button onclick="resetFlow()"
                            class="px-8 py-4 bg-surface-light dark:bg-[#000000]/10 text-text-main-light dark:text-white rounded-2xl font-bold transition-all hover:bg-[#333333] dark:hover:bg-[#000000]/20">Try
                            New Prompt</button>
                        <button id="save-itinerary-btn"
                            class="px-8 py-4 bg-primary text-white rounded-2xl font-bold shadow-lg shadow-[#0A0A0A]/30 hover:bg-primary-hover transition-all flex items-center gap-2">
                            <span class="material-icons-round">bookmark</span>
                            Save Itinerary
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let generatedPlan = null;

        function goBackOrPlan() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "{{ url_for('main.plan_trip') }}";
            }
        }

        function fillPreset(text) {
            document.getElementById('trip-prompt').value = text;
        }

        let isGeneratingPlan = false;
        async function generatePlan() {
            if (isGeneratingPlan) return;
            const prompt = (document.getElementById('trip-prompt').value || '').trim();
            if (!prompt) {
                alert("Please enter your trip details first.");
                return;
            }

            const btn = document.getElementById('generate-btn');
            const btnText = document.getElementById('btn-text');
            const loadingIcon = document.getElementById('loading-icon');
            const sparkleIcon = document.getElementById('sparkle-icon');

            // UI State
            isGeneratingPlan = true;
            btn.disabled = true;
            btnText.innerText = "Crafting Journey...";
            loadingIcon.classList.remove('hidden');
            sparkleIcon.classList.add('hidden');

            try {
                const response = await fetch('/api/ai-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                renderResults(data);
            } catch (error) {
                console.error(error);
                alert("Failed to generate plan. Please try again.");
            } finally {
                isGeneratingPlan = false;
                btn.disabled = false;
                btnText.innerText = "Generate Plan";
                loadingIcon.classList.add('hidden');
                sparkleIcon.classList.remove('hidden');
            }
        }

        function renderResults(data) {
            generatedPlan = data;
            document.getElementById('res-destination').innerText = data.destination;
            document.getElementById('res-tagline').innerText = data.tagline;
            document.getElementById('res-duration').innerText = data.duration;

            const grid = document.getElementById('itinerary-grid');
            grid.innerHTML = '';

            data.itinerary.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.className = 'relative';
                dayEl.innerHTML = `
                    <div class="absolute -left-[45px] top-0 w-8 h-8 rounded-full bg-primary border-4 border-[#333333] dark:border-surface-dark shadow-md flex items-center justify-center text-white text-[10px] font-bold">
                        ${day.day}
                    </div>
                    <div class="mb-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-primary">Day ${day.day}</span>
                        <h3 class="text-xl font-bold text-text-main-light dark:text-white mt-1">${day.theme}</h3>
                    </div>
                    <div class="space-y-6 mt-6">
                        ${day.activities.map(act => `
                            <div class="flex gap-6 group">
                                <div class="w-12 h-12 shrink-0 rounded-2xl bg-[#111111] dark:bg-[#000000]/5 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-all">
                                    <span class="material-icons-round">${act.icon || 'explore'}</span>
                                </div>
                                <div>
                                    <span class="text-[10px] font-black uppercase tracking-tighter text-text-muted-light group-hover:text-primary">${act.time}</span>
                                    <h4 class="font-bold text-text-main-light dark:text-white">${act.name}</h4>
                                    <p class="text-sm text-text-muted-light dark:text-muted-dark mt-1 leading-relaxed">${act.description}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                grid.appendChild(dayEl);
            });

            const tips = document.getElementById('res-tips');
            tips.innerHTML = data.travel_tips.map(tip => `
                <li class="flex items-start gap-3">
                    <span class="material-icons-round text-[#80deea] text-sm mt-0.5">check_circle</span>
                    <span>${tip}</span>
                </li>
            `).join('');

            // Transition
            document.getElementById('prompt-step').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('prompt-step').classList.add('hidden');
                const res = document.getElementById('results-step');
                res.classList.remove('hidden');
                setTimeout(() => {
                    res.classList.remove('opacity-0', 'translate-y-8');
                }, 50);
            }, 500);
        }

        function resetFlow() {
            generatedPlan = null;
            const res = document.getElementById('results-step');
            res.classList.add('opacity-0', 'translate-y-8');
            setTimeout(() => {
                res.classList.add('hidden');
                const prompt = document.getElementById('prompt-step');
                prompt.classList.remove('hidden');
                setTimeout(() => {
                    prompt.classList.remove('opacity-0', 'pointer-events-none');
                }, 50);
            }, 500);
        }

        document.getElementById('save-itinerary-btn')?.addEventListener('click', async function () {
            if (!generatedPlan || !generatedPlan.itinerary) {
                alert('Generate a plan first.');
                return;
            }

            const btn = this;
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons-round animate-spin">autorenew</span>Saving...';

            try {
                const response = await fetch('/api/save-itinerary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        destination: generatedPlan.destination || 'Magic Trip',
                        budget: generatedPlan.budget || 'Medium',
                        interests: generatedPlan.interests || 'General',
                        itinerary: generatedPlan.itinerary || [],
                        weather: {},
                        chat: []
                    })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.error || 'Save failed');
                btn.innerHTML = '<span class="material-icons-round">check_circle</span>Saved';
            } catch (err) {
                console.error('Save itinerary failed:', err);
                alert('Failed to save itinerary.');
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/background.js') }}"></script>
</body>

</html>
