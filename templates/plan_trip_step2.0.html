<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Plan a Trip - Style Selection | RoutheonSkups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/charcoal.css" />
    <link rel="stylesheet" href="/static/css/tailwind-output.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #FFFFFF;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: #0A0A0A;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s cubic-bezier(0.22,1,0.36,1), border-color 0.35s cubic-bezier(0.22,1,0.36,1);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 60px -10px #111111;
        }
        .category-card {
            background: #0A0A0A;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
        }
        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 60px -10px #111111;
            border-color: #111111;
        }
        .category-card.selected {
            border-color: #111111;
            background: #0A0A0A;
            box-shadow: 0 0 0 2px #0A0A0A;
        }
        .category-card.selected .check-mark {
            opacity: 1;
            transform: scale(1);
        }
        .btn-glass {
            background: #0A0A0A;
            color: #FFFFFF;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 9999px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
            position: relative;
            overflow: hidden;
        }
        .btn-glass:hover {
            background: #0A0A0A;
        }
        .btn-primary {
            background: #111111;
            color: #FFFFFF;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            background: #0A0A0A;
            transform: translateY(-1px);
            box-shadow: 0 10px 40px #0A0A0A;
        }
        .step-num {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
        }
        .step-active .step-num {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.06);
            color: #FFFFFF;
        }
        .step-active-lg .step-num {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.06);
            color: #FFFFFF;
        }
        .step-done .step-num {
            background: #0A0A0A;
            border: 1px solid #111111;
            color: rgba(255,255,255,0.7);
        }
        .step-inactive .step-num {
            background: #0A0A0A;
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>

<body>
    <div class="ks-cinema-bg"></div>
    <div class="ks-grain"></div>
    <div class="ks-vignette"></div>
    <canvas id="ks-particles-canvas"></canvas>

    {% include 'components/navbar.html' %}

    <main style="position:relative;z-index:1;min-height:100vh;padding:160px 16px 96px;overflow:hidden">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-center mb-12">
                <!-- Step Wizard -->
                <div class="glass-card" style="display:flex;align-items:center;gap:16px;padding:10px 24px;margin-bottom:32px">
                    <div class="step-done" style="display:flex;align-items:center;gap:8px">
                        <div class="step-num" style="width:28px;height:28px;font-size:12px">1</div>
                        <span style="font-size:12px;font-weight:700;color:#FFFFFF" class="hidden sm:inline">Destination</span>
                    </div>
                    <div style="width:24px;height:1px;background:#0A0A0A"></div>
                    <div class="step-done" style="display:flex;align-items:center;gap:8px">
                        <div class="step-num" style="width:28px;height:28px;font-size:12px">2</div>
                        <span style="font-size:12px;font-weight:700;color:#FFFFFF" class="hidden sm:inline">Dates</span>
                    </div>
                    <div style="width:24px;height:1px;background:#0A0A0A"></div>
                    <div class="step-active" style="display:flex;align-items:center;gap:8px">
                        <div class="step-active-lg"><div class="step-num">3</div></div>
                        <span style="font-size:13px;font-weight:700;color:#FFFFFF">Style</span>
                    </div>
                    <div style="width:24px;height:1px;background:#0A0A0A"></div>
                    <div class="step-inactive" style="display:flex;align-items:center;gap:8px">
                        <div class="step-num" style="width:28px;height:28px;font-size:12px">4</div>
                        <span style="font-size:12px;font-weight:700;color:#FFFFFF" class="hidden sm:inline">Review</span>
                    </div>
                </div>

                <h1 style="font-size:clamp(2rem,4vw,3rem);font-weight:900;text-align:center;letter-spacing:-0.03em;margin-bottom:16px;color:#FFFFFF">
                    What is your travel style?
                </h1>
                <p style="text-align:center;font-size:1.1rem;color:#FFFFFF;max-width:640px">
                    Pick categories to personalize your itinerary, or skip for recommendations based on your destination.
                </p>
            </div>

            <div id="category-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5 mb-6"></div>

            <div class="flex items-center justify-center mb-16 gap-3 flex-wrap">
                <button id="more-options-btn" class="btn-glass" style="padding:12px 40px">More Options</button>
                <button id="go-first-btn" class="btn-glass" style="padding:12px 32px">Go To First</button>
                <span id="page-indicator" style="font-size:13px;font-weight:600;color:#FFFFFF"></span>
            </div>

            <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:32px;border-top: 1px solid rgba(255,255,255,0.06)">
                <button onclick="history.back()"
                    class="btn-glass w-full sm:w-auto flex items-center justify-center gap-2"
                    style="padding:16px 32px;font-weight:700">
                    <span class="material-icons-round" style="font-size:20px">arrow_back</span>
                    Back
                </button>
                <div id="selection-count"
                    style="font-size:13px;font-weight:700;color:#FFFFFF;padding:8px 16px;background:#0A0A0A;border: 1px solid rgba(255,255,255,0.06);border-radius:9999px">
                    0 Categories Selected
                </div>
                <button id="next-step-btn"
                    class="btn-primary w-full sm:w-auto flex items-center justify-center gap-2"
                    style="padding:16px 48px;font-weight:700;box-shadow:0 10px 40px #0A0A0A">
                    Next Step
                    <span class="material-icons-round" style="font-size:20px">arrow_forward</span>
                </button>
            </div>
        </div>
    </main>

    <footer style="padding:64px 0 32px;border-top: 1px solid rgba(255,255,255,0.06)">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p style="font-size:12px;color:#FFFFFF">
                @2026 RoutheonSkups. All rights reserved. Made with &#10084;&#65039; for India.
            </p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const categoryGrid = document.getElementById('category-grid');
            const selectionCountEl = document.getElementById('selection-count');
            const nextBtn = document.getElementById('next-step-btn');
            const moreOptionsBtn = document.getElementById('more-options-btn');
            const goFirstBtn = document.getElementById('go-first-btn');
            const pageIndicator = document.getElementById('page-indicator');

            const categories = [
                { name: 'City', icon: '🏙️' },
                { name: 'Town', icon: '🏘️' },
                { name: 'Village', icon: '🏡' },
                { name: 'Beach', icon: '🏖️' },
                { name: 'Island', icon: '🏝️' },
                { name: 'Hill', icon: '⛰️' },
                { name: 'Mountain', icon: '⛰️' },
                { name: 'Valley', icon: '🌄' },
                { name: 'Lake', icon: '💧' },
                { name: 'River', icon: '🏞️' },
                { name: 'Ghat', icon: '🪜' },
                { name: 'Forest', icon: '🌲' },
                { name: 'Wildlife', icon: '🐾' },
                { name: 'Park', icon: '🌳' },
                { name: 'Garden', icon: '🌸' },
                { name: 'Fort', icon: '🏰' },
                { name: 'Palace', icon: '🏯' },
                { name: 'Monument', icon: '🏛️' },
                { name: 'Heritage', icon: '🏢' },
                { name: 'Temple', icon: '🛕' },
                { name: 'Church', icon: '⛪' },
                { name: 'Mosque', icon: '🕌' },
                { name: 'Gurudwara', icon: '⭐' },
                { name: 'Monastery', icon: '🏮' },
                { name: 'Museum', icon: '🏛️' },
                { name: 'Archaeology', icon: '🗿' },
                { name: 'Sanctuary', icon: '🛫' },
                { name: 'National Park', icon: '🌳' },
                { name: 'Adventure', icon: '🪂' },
                { name: 'Trek', icon: '🥾' },
                { name: 'Viewpoint', icon: '📷' },
                { name: 'Waterfall', icon: '🌊' },
                { name: 'Market', icon: '🏪' },
                { name: 'Food', icon: '🍽️' },
                { name: 'Culture', icon: '🎭' },
                { name: 'Festival', icon: '🎉' },
                { name: 'Transport', icon: '🚌' },
                { name: 'Harbour', icon: '⚓' },
                { name: 'Resort', icon: '🏊' },
                { name: 'Homestay', icon: '🏠' },
                { name: 'Experience', icon: '💡' },
                { name: 'Activity', icon: '🏃' }
            ];

            const pageSize = 10;
            let visibleCount = pageSize;
            const selectedCategories = new Set();

            const urlParams = new URLSearchParams(window.location.search);
            const existingStyles = urlParams.get('styles');
            if (existingStyles) {
                existingStyles.split(',').map(s => s.trim()).filter(Boolean).forEach(s => selectedCategories.add(s));
            }

            function updateSelectionCount() {
                const selectedCount = selectedCategories.size;
                if (selectedCount === 1) {
                    selectionCountEl.innerText = '1 Category Selected';
                } else {
                    selectionCountEl.innerText = `${selectedCount} Categories Selected`;
                }
            }

            function renderCategories() {
                const visibleItems = categories.slice(0, visibleCount);

                categoryGrid.innerHTML = visibleItems.map((item) => {
                    const isSelected = selectedCategories.has(item.name);
                    return `
                        <button type="button" data-category="${item.name}"
                            class="category-card ${isSelected ? 'selected' : ''} group relative p-6 text-center cursor-pointer min-h-[150px]"
                            style="display:flex;flex-direction:column;align-items:center;justify-content:center">
                            <div class="check-mark" style="position:absolute;top:12px;right:12px;opacity:0;transform:scale(0.5);transition:all 0.3s ease">
                                <div style="width:20px;height:20px;border-radius:50%;background:#111111;display:flex;align-items:center;justify-content:center">
                                    <span class="material-icons-round" style="font-size:11px;color:#FFFFFF">check</span>
                                </div>
                            </div>
                            <div style="width:44px;height:44px;margin-bottom:16px;border-radius:50%;background:#0A0A0A;display:flex;align-items:center;justify-content:center">
                                <span style="font-size:22px;line-height:1">${item.icon}</span>
                            </div>
                            <h3 style="font-size:1rem;font-weight:700;color:#FFFFFF;line-height:1.2">${item.name}</h3>
                        </button>
                    `;
                }).join('');

                pageIndicator.innerText = `Showing ${Math.min(visibleCount, categories.length)} of ${categories.length}`;
                moreOptionsBtn.disabled = visibleCount >= categories.length;
                moreOptionsBtn.style.opacity = moreOptionsBtn.disabled ? '0.5' : '1';
                moreOptionsBtn.style.cursor = moreOptionsBtn.disabled ? 'not-allowed' : 'pointer';
            }

            categoryGrid.addEventListener('click', (e) => {
                const card = e.target.closest('[data-category]');
                if (!card) return;

                const name = card.getAttribute('data-category');
                if (selectedCategories.has(name)) {
                    selectedCategories.delete(name);
                } else {
                    selectedCategories.add(name);
                }

                renderCategories();
                updateSelectionCount();
            });

            moreOptionsBtn.addEventListener('click', () => {
                const previousCount = visibleCount;
                visibleCount = Math.min(visibleCount + pageSize, categories.length);
                renderCategories();
                if (visibleCount > previousCount) {
                    setTimeout(() => {
                        window.scrollBy({ top: 280, behavior: 'smooth' });
                    }, 50);
                }
            });

            goFirstBtn.addEventListener('click', () => {
                visibleCount = pageSize;
                renderCategories();
                categoryGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            nextBtn.addEventListener('click', () => {
                if (selectedCategories.size > 0) {
                    urlParams.set('styles', Array.from(selectedCategories).join(','));
                }
                window.location.href = "{{ url_for('main.plan_trip_step3') }}?" + urlParams.toString();
            });

            updateSelectionCount();
            renderCategories();
        });
    </script>

    <script src="/static/js/background.js"></script>
</body>

</html>
