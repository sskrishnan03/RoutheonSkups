<style>

        display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        font-feature-settings: 'liga' 1; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-icons-round {
        font-family: 'Material Icons Round'; font-weight: normal; font-style: normal;
        font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
        display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    #ks-global-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #000000;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #ks-global-loader.active { opacity: 1; pointer-events: all; }
    .ks-loader-spinner {
        width: 36px; height: 36px;
        border: 2px solid rgba(255,255,255,0.06);
        border-top-color: rgba(255,255,255,0.7);
        border-radius: 50%;
        animation: ksSpin 0.8s linear infinite;
    }
    @keyframes ksSpin { to { transform: rotate(360deg); } }

    .ks-nav {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        width: calc(100% - 32px); max-width: 1200px; z-index: 1000;
        background: #000000;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 9999px; padding: 0 8px;
        transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    .ks-nav::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: transparent;
        pointer-events: none;
    }
    .ks-nav.scrolled {
        background: #000000;
        border-color: rgba(255,255,255,0.12);
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .ks-nav-inner {
        display: flex; align-items: center; justify-content: space-between;
        height: 56px; padding: 0 12px;

    .ks-nav-logo {

        text-decoration: none; flex-shrink: 0;
    }
    .ks-nav-logo img { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; }
    .ks-nav-logo span { font-size: 15px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.02em; }

    .ks-nav-links { display: flex; align-items: center; gap: 2px; }
    .ks-nav-link {
        padding: 6px 14px; border-radius: 9999px;
        font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7);
        text-decoration: none; transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
        white-space: nowrap;
        position: relative;
    }
    .ks-nav-link:hover { color: #FFFFFF; background: rgba(255,255,255,0.06); }
    .ks-nav-link.active {
        color: #FFFFFF;
        background: rgba(255,255,255,0.06);
    }

    .ks-nav-actions { display: flex; align-items: center; gap: 4px; }
    .ks-nav-icon-btn {
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.7); background: transparent; border: none; cursor: pointer;
        transition: all 0.25s cubic-bezier(0.22,1,0.36,1); position: relative;
    }
    .ks-nav-icon-btn:hover { color: #FFFFFF; background: rgba(255,255,255,0.06); }
    .ks-nav-icon-btn .material-symbols-outlined { font-size: 20px; }

    .ks-notif-badge {
        position: absolute; top: 4px; right: 4px;
        width: 8px; height: 8px; background: #FB7185; border-radius: 50%;
        border: 2px solid #000000;
        box-shadow: 0 0 8px rgba(251,113,133,0.4);
    }
    .ks-notif-count {
        position: absolute; top: -2px; right: -2px;
        min-width: 16px; height: 16px; padding: 0 4px;
        background: #FB7185; color: #FFFFFF; font-size: 10px; font-weight: 700;
        border-radius: 9999px; display: flex; align-items: center; justify-content: center;
        border: 2px solid #000000;
        box-shadow: 0 0 8px rgba(251,113,133,0.5);
        animation: ksNotifPop 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes ksNotifPop { from { transform: scale(0); } to { transform: scale(1); } }

    .ks-notif-panel {
        position: absolute; right: 0; top: calc(100% + 8px);
        width: 380px; max-height: 520px;
        background: #000000;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px; overflow: hidden; z-index: 50;
        box-shadow: 0 12px 40px #111111, 0 0 1px rgba(255,255,255,0.08) inset;
        opacity: 0; transform: translateY(-6px) scale(0.97);
        transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
        pointer-events: none;
    }
    .ks-notif-panel::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(160deg, #0A0A0A 0%, transparent 40%);
        pointer-events: none;
    }
    .ks-notif-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

    .ks-notif-header {
        padding: 16px 16px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex; align-items: center; justify-content: space-between;
        position: relative; z-index: 1;
    }
    .ks-notif-header-title {
        font-size: 14px; font-weight: 700; color: #FFFFFF;
        display: flex; align-items: center; gap: 8px;
    }
    .ks-notif-header-count {
        font-size: 11px; font-weight: 600; color: #FB7185;
        background: rgba(251,113,133,0.1);
        padding: 2px 8px; border-radius: 9999px;
    }
    .ks-notif-header-actions {
        display: flex; gap: 2px;
    }
    .ks-notif-header-btn {
        padding: 4px 8px; border-radius: 6px;
        font-size: 11px; font-weight: 600;
        color: rgba(255,255,255,0.5); background: transparent;
        border: none; cursor: pointer;
        transition: all 0.2s ease;
    }
    .ks-notif-header-btn:hover { color: #FB7185; background: rgba(251,113,133,0.08); }

    .ks-notif-list {
        max-height: 400px; overflow-y: auto; overflow-x: hidden;
        position: relative; z-index: 1;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .ks-notif-list::-webkit-scrollbar { width: 4px; }
    .ks-notif-list::-webkit-scrollbar-track { background: transparent; }
    .ks-notif-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    .ks-notif-item {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        display: flex; gap: 12px; align-items: flex-start;
        transition: all 0.2s ease;
        cursor: default;
        position: relative;
    }
    .ks-notif-item:hover { background: rgba(255,255,255,0.03); }
    .ks-notif-item.unread { background: rgba(251,113,133,0.03); }
    .ks-notif-item.unread::before {
        content: '';
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 2px; background: #FB7185;
    }
    .ks-notif-item.removing {
        opacity: 0; transform: translateX(40px);
        max-height: 0; padding-top: 0; padding-bottom: 0;
        border-color: transparent; overflow: hidden;
    }

    .ks-notif-icon {
        width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; font-size: 16px;
    }
    .ks-notif-icon.trip { background: rgba(59,130,246,0.12); color: #3B82F6; }
    .ks-notif-icon.success { background: rgba(34,197,94,0.12); color: #22C55E; }
    .ks-notif-icon.warning { background: rgba(245,158,11,0.12); color: #F59E0B; }
    .ks-notif-icon.info { background: rgba(139,92,246,0.12); color: #8B5CF6; }

    .ks-notif-body { flex: 1; min-width: 0; }
    .ks-notif-msg {
        font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85);
        line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
    }
    .ks-notif-meta {
        display: flex; align-items: center; gap: 8px;
        margin-top: 6px;
    }
    .ks-notif-time {
        font-size: 11px; color: rgba(255,255,255,0.3);
    }
    .ks-notif-type-label {
        font-size: 10px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px;
    }
    .ks-notif-type-label.trip { color: #3B82F6; background: rgba(59,130,246,0.1); }
    .ks-notif-type-label.success { color: #22C55E; background: rgba(34,197,94,0.1); }
    .ks-notif-type-label.warning { color: #F59E0B; background: rgba(245,158,11,0.1); }
    .ks-notif-type-label.info { color: #8B5CF6; background: rgba(139,92,246,0.1); }

    .ks-notif-actions {
        display: flex; gap: 2px; flex-shrink: 0; align-self: flex-start;
        opacity: 0; transition: opacity 0.2s ease;
    }
    .ks-notif-item:hover .ks-notif-actions { opacity: 1; }
    .ks-notif-action-btn {
        width: 24px; height: 24px; border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: none; cursor: pointer;
        color: rgba(255,255,255,0.3); transition: all 0.2s ease;
    }
    .ks-notif-action-btn:hover { color: #FFFFFF; background: rgba(255,255,255,0.08); }
    .ks-notif-action-btn.delete:hover { color: #EF4444; background: rgba(239,68,68,0.1); }
    .ks-notif-action-btn .material-symbols-outlined { font-size: 14px; }

    .ks-notif-empty {
        padding: 40px 20px; text-align: center;
        position: relative; z-index: 1;
    }
    .ks-notif-empty-icon {
        width: 48px; height: 48px; border-radius: 14px;
        background: rgba(255,255,255,0.04);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 12px;
    }
    .ks-notif-empty-icon .material-symbols-outlined {
        font-size: 22px; color: rgba(255,255,255,0.2);
    }
    .ks-notif-empty-title {
        font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5);
        margin-bottom: 4px;
    }
    .ks-notif-empty-desc {
        font-size: 12px; color: rgba(255,255,255,0.25);
    }

    .ks-notif-footer {
        padding: 10px 16px;
        border-top: 1px solid rgba(255,255,255,0.06);
        text-align: center;
        position: relative; z-index: 1;
    }
    .ks-notif-footer-link {
        font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.35);
        text-decoration: none; transition: color 0.2s ease;
        cursor: pointer;
    }
    .ks-notif-footer-link:hover { color: #FB7185; }

    .ks-notif-loading {
        padding: 30px 20px; text-align: center;
        position: relative; z-index: 1;
    }
    .ks-notif-spinner {
        width: 24px; height: 24px;
        border: 2px solid rgba(255,255,255,0.06);
        border-top-color: rgba(255,255,255,0.5);
        border-radius: 50%;
        animation: ksSpin 0.8s linear infinite;
        margin: 0 auto;
    }

    .ks-profile-btn {
        width: 32px; height: 32px; border-radius: 50%;
        overflow: hidden; border: 1.5px solid rgba(255,255,255,0.06);
        transition: all 0.25s cubic-bezier(0.22,1,0.36,1); cursor: pointer;
        background: #111111;
        display: flex; align-items: center; justify-content: center;
    }
    .ks-profile-btn:hover {
        border-color: rgba(255,255,255,0.12);
        transform: scale(1.05);
    }
    .ks-profile-btn img { width: 100%; height: 100%; object-fit: cover; }

    /* Dropdowns */
    .ks-dropdown {
        position: absolute; right: 0; top: calc(100% + 8px);
        min-width: 260px; background: #000000;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px; overflow: hidden; z-index: 50;
        box-shadow: 0 12px 40px #111111;
        opacity: 0; transform: translateY(-6px) scale(0.97);
        transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
        pointer-events: none;
    }
    .ks-dropdown::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(160deg, #0A0A0A 0%, transparent 40%);
        pointer-events: none;
    }
    .ks-dropdown.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
    .ks-dropdown-header {
        padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
        background: #000000;
    }
    .ks-dropdown-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px; font-size: 13px; font-weight: 600;
        color: rgba(255,255,255,0.7); text-decoration: none;
        transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
        border-radius: 8px;
        margin: 2px 6px;
    }
    .ks-dropdown-item:hover { color: #FFF; background: rgba(255,255,255,0.06); }
    .ks-dropdown-item .material-symbols-outlined { font-size: 18px; color: rgba(255,255,255,0.7); }
    .ks-dropdown-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0; }

    /* More dropdown */
    .ks-more-btn {
        padding: 6px 12px; border-radius: 9999px; font-size: 13px; font-weight: 600;
        color: rgba(255,255,255,0.7); background: transparent; border: none; cursor: pointer;
        transition: all 0.2s ease; display: flex; align-items: center; gap: 2px;
    }
    .ks-more-btn:hover { color: #FFFFFF; background: rgba(255,255,255,0.06); }

    /* Mobile */
    .ks-mobile-btn {
        width: 36px; height: 36px; border-radius: 50%;
        display: none; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.7); background: transparent; border: none; cursor: pointer;
    }
    .ks-mobile-menu {
        display: none; padding: 8px; border-top: 1px solid rgba(255,255,255,0.06);
    }
    .ks-mobile-menu a {
        display: block; padding: 10px 16px; border-radius: 12px;
        font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7);
        text-decoration: none; transition: all 0.2s ease;
    }
    .ks-mobile-menu a:hover { color: #FFF; background: rgba(255,255,255,0.06); }
    .ks-mobile-menu a.active { color: #FFF; background: rgba(255,255,255,0.06); }

    @media (max-width: 768px) {
        .ks-nav { width: calc(100% - 16px); top: 8px; }
        .ks-nav-links { display: none; }
        .ks-nav-actions { display: none; }
        .ks-mobile-btn { display: flex; }
        .ks-nav-actions-mobile { display: flex; align-items: center; gap: 4px; }
        .ks-notif-panel {
            position: fixed; left: 8px; right: 8px; top: 56px;
            width: auto; max-height: 70vh;
            border-radius: 14px;
        }
    }
</style>

            <iframe id="ks-profile-iframe" src="" style="width:100%;height:100%;border:none;background:#000;" loading="lazy"></iframe>
        </div>
        <!-- Close button outside card, top right -->
        <button id="ks-profile-modal-close" style="position:absolute;top:16px;right:16px;z-index:10001;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);">
            <span class="material-symbols-outlined" style="font-size:20px;color:#FFFFFF;">close</span>
        </button>
    </div>
    <style>
        @keyframes ksProfileIn { from { opacity:0; } to { opacity:1; } }
        @keyframes ksCardIn { from { opacity:0; transform:scale(0.95) translateY(16px); } to { opacity:1; transform:scale(1) translateY(0); } }
        #ks-profile-modal { margin:0 !important; padding:0 !important; top:0 !important; left:0 !important; right:0 !important; bottom:0 !important; }
        #ks-profile-backdrop { margin:0 !important; padding:0 !important; top:0 !important; left:0 !important; right:0 !important; bottom:0 !important; }
        #ks-profile-card { margin:0 !important; }
        
        /* Ensure body has no margin when modal is open */
        body.modal-open { margin:0 !important; padding:0 !important; overflow:hidden !important; }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            #ks-profile-card { width:95vw !important; height:85vh !important; }
            #ks-profile-modal-close { top:12px !important; right:12px !important; }
        }
        @media (max-width: 480px) {
            #ks-profile-card { width:100vw !important; height:100vh !important; border-radius:0 !important; }
            #ks-profile-modal-close { top:8px !important; right:8px !important; }
        }
    </style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Navbar scroll
    var nav = document.getElementById('ks-navbar');
    function checkScroll() {
        nav.classList.toggle('scrolled', window.scrollY > 20);
    }
    checkScroll();
    window.addEventListener('scroll', checkScroll, { passive: true });

    // Dropdowns
    function setupDropdown(btnId, dropdownId) {
        var btn = document.getElementById(btnId);
        var dd = document.getElementById(dropdownId);
        if (!btn || !dd) return;
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            document.querySelectorAll('.ks-dropdown').forEach(function(d) { if (d !== dd) d.classList.remove('open'); });
            var notifPanel = document.getElementById('ks-notif-panel');
            if (notifPanel && dd !== notifPanel) notifPanel.classList.remove('open');
            dd.classList.toggle('open');
        });
    }
    setupDropdown('ks-more-btn', 'ks-more-dropdown');

    // --- Notification Panel ---
    var notifBtn = document.getElementById('ks-notif-btn');
    var notifPanel = document.getElementById('ks-notif-panel');
    var notifList = document.getElementById('ks-notif-list');
    var notifCountEl = document.getElementById('ks-notif-count');
    var notifFooter = document.getElementById('ks-notif-footer');
    var notifMarkAll = document.getElementById('ks-notif-mark-all');
    var notifClearAll = document.getElementById('ks-notif-clear-all');
    var notifLoaded = false;
    var notifPollTimer = null;

    var notifTypeIcons = {
        trip: 'flight',
        success: 'check_circle',
        warning: 'warning',
        info: 'lightbulb'
    };
    var notifTypeLabels = {
        trip: 'Trip',
        success: 'Update',
        warning: 'System',
        info: 'Suggestion'
    };

    function escapeHtml(t) {
        var d = document.createElement('div');
        d.textContent = t || '';
        return d.innerHTML;
    }

    function timeAgo(dateStr) {
        if (!dateStr) return '';
        var d = new Date(dateStr);
        var now = new Date();
        var diff = Math.floor((now - d) / 1000);
        if (diff < 60) return 'Just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderNotifItem(n) {
        var icon = notifTypeIcons[n.type] || 'info';
        var typeLabel = notifTypeLabels[n.type] || 'Info';
        var readClass = n.is_read ? '' : ' unread';
        var linkAttr = n.link_url ? ' data-link-url="' + escapeHtml(n.link_url) + '"' : '';
        return '<div class="ks-notif-item' + readClass + '" data-notif-id="' + n.id + '"' + linkAttr + '>'
            + '<div class="ks-notif-icon ' + escapeHtml(n.type) + '">'
            + '  <span class="material-symbols-outlined">' + icon + '</span>'
            + '</div>'
            + '<div class="ks-notif-body">'
            + '  <div class="ks-notif-msg">' + escapeHtml(n.message) + '</div>'
            + '  <div class="ks-notif-meta">'
            + '    <span class="ks-notif-type-label ' + escapeHtml(n.type) + '">' + typeLabel + '</span>'
            + '    <span class="ks-notif-time">' + timeAgo(n.created_at_iso || n.created_at) + '</span>'
            + '  </div>'
            + '</div>'
            + '<div class="ks-notif-actions">'
            + (!n.is_read ? '<button class="ks-notif-action-btn" data-action="read" title="Mark as read"><span class="material-symbols-outlined">done</span></button>' : '')
            + '<button class="ks-notif-action-btn delete" data-action="delete" title="Delete"><span class="material-symbols-outlined">close</span></button>'
            + '</div>'
            + '</div>';
    }

    function updateNotifCount(count) {
        if (count > 0) {
            notifCountEl.textContent = count > 99 ? '99+' : count;
            notifCountEl.style.display = 'flex';
        } else {
            notifCountEl.style.display = 'none';
        }
    }

    function renderNotifEmpty() {
        notifList.innerHTML =
            '<div class="ks-notif-empty">'
            + '<div class="ks-notif-empty-icon"><span class="material-symbols-outlined">notifications_off</span></div>'
            + '<div class="ks-notif-empty-title">All caught up</div>'
            + '<div class="ks-notif-empty-desc">No notifications yet. We\'ll let you know when something happens.</div>'
            + '</div>';
    }

    async function fetchNotifications() {
        try {
            var r = await fetch('/api/notifications?generate=1');
            if (!r.ok) throw new Error();
            var data = await r.json();
            var notifs = data.notifications || [];
            var unread = data.unread_count || 0;

            updateNotifCount(unread);

            if (notifs.length === 0) {
                renderNotifEmpty();
                notifFooter.style.display = 'none';
                return;
            }

            notifFooter.style.display = 'block';
            var html = '';
            for (var i = 0; i < notifs.length; i++) {
                html += renderNotifItem(notifs[i]);
            }
            notifList.innerHTML = html;
            notifLoaded = true;
        } catch (e) {
            notifList.innerHTML =
                '<div class="ks-notif-empty">'
                + '<div class="ks-notif-empty-title">Couldn\'t load notifications</div>'
                + '<div class="ks-notif-empty-desc">Try refreshing the page.</div>'
                + '</div>';
        }
    }

    if (notifBtn && notifPanel) {
        notifBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            document.querySelectorAll('.ks-dropdown').forEach(function(d) { d.classList.remove('open'); });
            var wasOpen = notifPanel.classList.contains('open');
            notifPanel.classList.toggle('open');
            if (!wasOpen && !notifLoaded) {
                fetchNotifications();
            }
        });

        notifPanel.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        notifList.addEventListener('click', async function(e) {
            var actionBtn = e.target.closest('[data-action]');
            if (!actionBtn) {
                var item = e.target.closest('.ks-notif-item');
                if (item) {
                    var notifId = item.dataset.notifId;
                    if (item.classList.contains('unread')) {
                        try {
                            await fetch('/api/notifications/' + notifId + '/read', { method: 'POST' });
                            item.classList.remove('unread');
                            var readBtn = item.querySelector('[data-action="read"]');
                            if (readBtn) readBtn.remove();
                            var current = parseInt(notifCountEl.textContent) || 0;
                            updateNotifCount(Math.max(0, current - 1));
                        } catch (err) {}
                    }
                    if (item.dataset.linkUrl) {
                        window.location.href = item.dataset.linkUrl;
                    }
                }
                return;
            }

            var action = actionBtn.dataset.action;
            var item = actionBtn.closest('.ks-notif-item');
            var notifId = item ? item.dataset.notifId : null;
            if (!notifId) return;

            if (action === 'read') {
                try {
                    await fetch('/api/notifications/' + notifId + '/read', { method: 'POST' });
                    item.classList.remove('unread');
                    actionBtn.remove();
                    var current = parseInt(notifCountEl.textContent) || 0;
                    updateNotifCount(Math.max(0, current - 1));
                } catch (err) {}
            } else if (action === 'delete') {
                try {
                    await fetch('/api/notifications/' + notifId, { method: 'DELETE' });
                    item.classList.add('removing');
                    setTimeout(function() {
                        item.remove();
                        if (!notifList.querySelector('.ks-notif-item')) {
                            renderNotifEmpty();
                            notifFooter.style.display = 'none';
                            updateNotifCount(0);
                        }
                    }, 300);
                    if (item.classList.contains('unread')) {
                        var current = parseInt(notifCountEl.textContent) || 0;
                        updateNotifCount(Math.max(0, current - 1));
                    }
                } catch (err) {}
            }
        });

        if (notifMarkAll) {
            notifMarkAll.addEventListener('click', async function(e) {
                e.stopPropagation();
                try {
                    await fetch('/api/notifications/read-all', { method: 'POST' });
                    notifList.querySelectorAll('.ks-notif-item.unread').forEach(function(item) {
                        item.classList.remove('unread');
                        var readBtn = item.querySelector('[data-action="read"]');
                        if (readBtn) readBtn.remove();
                    });
                    updateNotifCount(0);
                } catch (err) {}
            });
        }

        if (notifClearAll) {
            notifClearAll.addEventListener('click', async function(e) {
                e.stopPropagation();
                try {
                    await fetch('/api/notifications/clear', { method: 'POST' });
                    renderNotifEmpty();
                    notifFooter.style.display = 'none';
                    updateNotifCount(0);
                } catch (err) {}
            });
        }

        notifPollTimer = setInterval(function() {
            if (notifPanel.classList.contains('open')) {
                fetchNotifications();
            }
        }, 30000);
    }

    document.addEventListener('click', function() {
        document.querySelectorAll('.ks-dropdown').forEach(function(d) { d.classList.remove('open'); });
        if (notifPanel) notifPanel.classList.remove('open');
        var mm = document.getElementById('ks-mobile-menu');
        if (mm) mm.style.display = 'none';
    });

    // Mobile menu
    var mobileBtn = document.getElementById('ks-mobile-btn');
    var mobileMenu = document.getElementById('ks-mobile-menu');
    if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block';
        });
    }

    // Loader
    function showLoader() { document.getElementById('ks-global-loader').classList.add('active'); }
    function hideLoader() { document.getElementById('ks-global-loader').classList.remove('active'); }
    window.ksShowLoader = showLoader;
    window.ksHideLoader = hideLoader;

    document.addEventListener('submit', function(e) {
        var form = e.target;
        if (form && (form.dataset.noLoader === 'true' || form.id === 'chat-form')) return;
        var btn = e.submitter;
        if (btn && btn.dataset.noLoader === 'true') return;
        if (btn && !btn.disabled) showLoader();
    });
    document.addEventListener('click', function(e) {
        if (e.target.closest('[data-loading="true"]')) showLoader();
    });

    // Profile Card Popup
    var profileBtn = document.getElementById('ks-profile-btn');
    var profileModal = document.getElementById('ks-profile-modal');
    var profileBackdrop = document.getElementById('ks-profile-backdrop');
    var profileClose = document.getElementById('ks-profile-modal-close');
    var profileCard = document.getElementById('ks-profile-card');
    var profileIframe = document.getElementById('ks-profile-iframe');

    if (profileBtn && profileModal) {
        profileBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (profileIframe) profileIframe.src = '/profile/embed';
            profileModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            document.body.classList.add('modal-open');
        });
        function closeProfileModal() {
            profileModal.style.display = 'none';
            document.body.style.overflow = '';
            document.body.classList.remove('modal-open');
            if (profileIframe) { profileIframe.src = 'about:blank'; }
        }
        if (profileClose) profileClose.addEventListener('click', closeProfileModal);
        if (profileBackdrop) profileBackdrop.addEventListener('click', closeProfileModal);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && profileModal.style.display === 'flex') closeProfileModal(); });

        var mobileProfileBtn = document.getElementById('ks-mobile-profile-btn');
        if (mobileProfileBtn) {
            mobileProfileBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (profileIframe) profileIframe.src = '/profile/embed';
                profileModal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                document.body.classList.add('modal-open');
            });
        }

        var mobileNotifBtn = document.getElementById('ks-mobile-notif-btn');
        if (mobileNotifBtn && notifBtn) {
            mobileNotifBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                notifBtn.click();
            });
        }
    }
});
</script>
